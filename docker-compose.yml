version: '3.8'

services:
  database:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: mafia_user
      POSTGRES_PASSWORD: mafia_pass
      POSTGRES_DB: ${DB_NAME}
    # 🔒 ربط المنفذ بالمضيف المحلي فقط (يمنع الوصول الخارجي المباشر لقاعدة البيانات)
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    # 🔒 ربط المنفذ بالمضيف المحلي فقط (Redis بلا كلمة سر — يجب ألا يُكشف خارجياً)
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # 🌍 بيئة التشغيل — تُضبط `production` في .env على الخادم.
      #    أثرها الكامل في الكود: تفعيل حارس السرّ الضعيف (config/env.ts) وإيقاف
      #    بذر اللعبة التجريبية عند كل إقلاع (index.ts). الافتراضي development
      #    كي لا ينكسر التشغيل المحلي بالسرّ الافتراضي.
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT}
      - DATABASE_URL=postgresql://mafia_user:mafia_pass@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-mafia_secret_key_123}
      # مفاتيح VAPID لـ Web Push (iOS/Safari). إن لم تُمرَّر فسيولّدها الباكند ويحفظها
      # داخل volume الـ uploads ليبقى الزوج ثابتاً بين عمليات إعادة التشغيل.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      # 🔒 الرقم السرّي لفتح الأدوات الحسّاسة (تعديل الأرقام/الأسماء). يُضبط في .env على الخادم — لا يُكتب هنا.
      - RENUMBER_SECRET=${RENUMBER_SECRET:-}
      # 🎙️ Cloudflare RealtimeKit (صوت/فيديو اللعب عن بُعد). القيم في .env على الخادم — لا تُكتب هنا.
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_REALTIMEKIT_APP_ID=${CLOUDFLARE_REALTIMEKIT_APP_ID:-}
      - CLOUDFLARE_REALTIMEKIT_TOKEN=${CLOUDFLARE_REALTIMEKIT_TOKEN:-}
      # 💬 WhatsApp Cloud API — مركز المحادثات والبوت. القيم في .env على الخادم — لا تُكتب هنا.
      - WA_TOKEN=${WA_TOKEN:-}
      - WA_PHONE_NUMBER_ID=${WA_PHONE_NUMBER_ID:-}
      - WA_WABA_ID=${WA_WABA_ID:-}
      - WA_WEBHOOK_VERIFY_TOKEN=${WA_WEBHOOK_VERIFY_TOKEN:-}
      - WA_APP_SECRET=${WA_APP_SECRET:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WA_WEBHOOK_URL=${N8N_WA_WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - database
      - redis
    volumes:
      - uploads_data:/app/uploads
      - ./google-service-account.json:/app/google-service-account.json
      # بيانات اعتماد Firebase Admin (لإرسال FCM للأندرويد/كروم). الملف سرّي وخارج git؛
      # يُوضع يدوياً على السيرفر في backend/firebase-service-account.json ويُركّب للقراءة فقط.
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:${BACKEND_PORT}
    restart: always
    environment:
      - PORT=${FRONTEND_PORT}
      - BACKEND_URL=http://backend:${BACKEND_PORT}
      - HOSTNAME=0.0.0.0
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend


volumes:
  db_data:
  redis_data:
  uploads_data:
