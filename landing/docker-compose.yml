# 🌐 mafia-club.masaros.net — موقع الهبوط + الصفحات القانونيّة التي تطلبها ميتا (خصوصيّة، شروط، حذف البيانات)
# المنفذ 3060 (نطاق 30xx للواجهات) — مربوط بـ127.0.0.1 فقط؛ الوصول العامّ عبر نفق Cloudflare.
services:
  landing:
    image: nginx:1.27-alpine
    container_name: mafia-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3060:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
