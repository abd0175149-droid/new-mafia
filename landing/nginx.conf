server {
  listen 80;
  server_name mafia-club.masaros.net _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # خلف نفق Cloudflare — لا نكشف نسخة الخادم
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  location ~* \.(png|jpg|jpeg|webp|svg|ico|css)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

  location / { try_files $uri $uri/ $uri/index.html =404; }

  error_page 404 /index.html;
}
