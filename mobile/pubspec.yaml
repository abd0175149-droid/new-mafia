name: mafia_club
description: "نادي المافيا — تطبيق اللاعب"
publish_to: 'none'

# الإصدار تقرأه بوابة الإصدار (GET /api/app/release) — ارفعه مع كل نشر.
# 0.2.0+2: النظام الزجاجيّ للمنصّتين (تنفيذ الملفّ 95) — أول توزيع اختبار خارجيّ.
# 0.2.0+3: أيقونة أندرويد من الشعار (كانت أيقونة Flutter الافتراضية).
version: 0.2.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتنقّل
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # الحركة
  flutter_animate: ^4.5.2

  # الشبكة
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # الإشعارات
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # التخزين
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # أدوات
  intl: ^0.20.1
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  # مجلّد مؤقّت لصورة الإشعار (BigPicture يقرأ ملفّاً لا رابطاً). كان يصل
  # كاعتماديّةٍ عابرة — والاعتماد على العابر يكسر بلا إنذار عند ترقية غيره.
  path_provider: ^2.1.5
  dotted_border: ^2.1.0

  # الأفاتار: اختيار من المعرض ثم ترميز ناتج القص JPEG بجودة 92
  image_picker: ^1.1.2
  image: ^4.3.0

  # 🔢 تصفير badge الأيقونة على iOS — الخادم يرسل badge:1 ولا يمسحه أحد
  app_badge_plus: ^1.2.4

  # إذنٌ مرفوض لا يُطلب ثانيةً على أندرويد — الطريق الوحيد إعدادات النظام
  app_settings: ^5.1.1

  # فيديو الإشعارات الغنية (إعلانات النادي) — تشغيل داخل التطبيق
  video_player: ^2.9.2
  flutter_svg: ^2.3.0
  vibration: ^3.2.0
  audioplayers: ^6.7.1

  # الصوت المباشر عن بُعد (M5) + نوع RtkError من واجهة المنصّة —
  # الميزة خلف بوّابة can_host_remote ولم تُطلَق بعد (P0 الأمنيّ أولاً)
  # 🔴 realtimekit_core مستبعَدة (12 آب): اعتماديّتها الأصليّة على
  #    gitlab.cfdata.org الداخليّ تُسقط بناء iOS كلَّه. التفاصيل وطريق
  #    الإعادة في lib/features/voice/voice_service.dart آخر الملفّ.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # اختبارات على جهازٍ حقيقيّ: تقيس زمن الإطارات فعلياً
  integration_test:
    sdk: flutter

  # توليد أيقونة iOS وشاشة الإقلاع — أدوات بناء لا تُشحن مع التطبيق
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ══════════════════════════════════════════════════════
# 🎨 أيقونة التطبيق — 91-release-ios.md §11
# ══════════════════════════════════════════════════════
# المصدر assets/icon/app_icon.png مشتقّ من frontend/public/mafia_logo.png.
# الأصل 1000×1200 بقناة ألفا لا 1024×1024 كما يفترض الملف 91 — فحُشِّي
# إلى مربّع على #050505 (حشوٌ لا تمديد، وإلا انسحق الشعار) ثم صُغِّر.
# Apple ترفض قناة الألفا في أيقونة المتجر، فتُزال هنا لا هناك.
flutter_launcher_icons:
  ios: true
  # كان false بافتراضٍ خاطئ أن أندرويد «مكتمل» — كان على أيقونة Flutter
  # الافتراضية فعلياً (لاحظه المالك بعد أول توزيع خارجيّ).
  android: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#050505"
  # أيقونة أندرويد التكيّفية: المقدَّمة نسخة مبطَّنة (الشعار 62% في المركز
  # على `#050505` — android_adaptive_fg.png مولَّدة من app_icon) كي لا يقصّ
  # القناعُ الدائريّ قبّعةَ الشعار الملاصقة للحافّة في الأصل. خلفية المقدّمة
  # معتمة بنفس لون الخلفية عمداً — النتيجة واحدة والقناع يتكفّل بالشكل.
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/icon/android_adaptive_fg.png"

# ══════════════════════════════════════════════════════
# 🚀 شاشة الإقلاع — 93 §6
# ══════════════════════════════════════════════════════
flutter_native_splash:
  color: "#050505"
  image: assets/icon/splash_logo.png
  ios: true
  android: false
  web: false
  # ⚠️ fullscreen: true يكتب UIStatusBarHidden=true في Info.plist — وهو
  # مفتاح دائم يخفي شريط الحالة في التطبيق كلّه لا في شاشة الإقلاع وحدها.
  # الويب يعرض الشريط، و91 §6.5 تنصّ على SystemUiOverlayStyle.light مع
  # الرسم تحته عبر SafeArea. فيبقى ظاهراً.
  fullscreen: false
  ios_content_mode: center

flutter:
  uses-material-design: true

  # ══════════════════════════════════════════════════════
  # الأصوات — مولَّدة محلياً، لا تعتمد على شبكة
  # ══════════════════════════════════════════════════════
  # `my_turn.wav`: ثلاث نغمات جيبية صاعدة ٦٦٠→٨٨٠→١١٠٠Hz بإزاحات
  # 0/0.2/0.4s — نظير `WebAudio` في الويب حرفياً. أصلٌ مسبق التوليد بدل
  # تركيبٍ وقت التشغيل: التركيب يحتاج إذناً صوتياً على iOS وقد يصمت.
  # شيدر الانكسار العدسيّ — يغذّي GlassSurface في core/ui/glass.dart
  shaders:
    - shaders/liquid_glass.frag

  assets:
    - assets/sounds/
    # 🔴 الشعار كان أصلاً لأيقونة التطبيق والسبلاش فقط وغير مُعلَنٍ للاستعمال
    #    داخل الواجهة، فرسمت شاشة الترحيب أيقونةً عامّة بدل هويّة النادي —
    #    أوّل انطباعٍ لمستخدمٍ جديد (AUTH-1).
    - assets/icon/splash_logo.png

  # ══════════════════════════════════════════════════════
  # الخطوط أصول محلية — لا google_fonts وقت التشغيل
  # ══════════════════════════════════════════════════════
  # قراران وراء ذلك: التكافؤ دون اتصال (اللاعب في قاعة قد لا تكون شبكتها
  # ممتازة، وخطّ لا يصل يعني واجهةً تُرسم بخطّ نظام مختلف)، وثبات النسخة
  # (خطّ يتغيّر عند جوجل لا يغيّر شكل التطبيق فجأة).
  fonts:
    # ── Amiri: كل العناوين والنصوص المسرحية (serif النوار) ──
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
          weight: 400
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700

    # ── Tajawal: نصّ الجسم العربي — الـsans الفعليّ ──
    # (الويب يذكر Inter أوّلاً لكنه لا يُحمَّل أبداً، فالفعليّ Tajawal)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-300.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-900.ttf
          weight: 900

    # ── JetBrains Mono: اللاتينية والمعرّفات والمؤقّت ──
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

    # ── الثلاثة التالية أصول خطّ فقط ──
    # لا تُربط بـTextTheme؛ تُختار وقت التشغيل حسب
    # cardTemplate.elements.fontFamily في قوالب بطاقات الأدوار (ملف 22).
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-700.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-400.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi-700.ttf
          weight: 700
